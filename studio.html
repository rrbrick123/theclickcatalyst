<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Click Catalyst Studio — Pro Mobile</title>
<style>
:root{--primary:#e60023;--dark:#111;--bg:#f4f5f7;--card:#fff;--border:#dcdcdc}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--dark);margin:0;padding:12px}
.container{max-width:1180px;margin:0 auto}
header{max-width:1180px;margin:0 auto 16px;background:var(--card);padding:14px 18px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.status-badge{display:inline-block;margin-top:8px;background:#e0f2fe;color:#0369a1;padding:5px 10px;border-radius:20px;font-size:12px;font-weight:600;border:1px solid #bae6fd}
.card{background:var(--card);padding:16px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:16px}
h2{margin-top:0;font-size:16px;border-bottom:1px solid #eee;padding-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
label{display:block;font-weight:600;margin:12px 0 6px;font-size:13px}
input[type=text],select,textarea{width:100%;padding:11px;border:1px solid var(--border);border-radius:8px;font-size:14px;box-sizing:border-box}
textarea{height:105px;resize:vertical}
.btn{background:var(--primary);color:#fff;border:none;padding:12px 16px;border-radius:24px;font-weight:600;cursor:pointer;font-size:14px;width:100%;margin-top:10px;display:block;text-align:center;box-sizing:border-box}
.btn-secondary{background:#1f2937}
.btn-outline{background:transparent;color:#333;border:1px solid #333}
.btn-small{width:auto;padding:6px 12px;font-size:12px;margin-top:0;display:inline-block}
canvas{width:100%;max-width:320px;height:auto;border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.12);display:block;margin:0 auto}
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}
th,td{border-bottom:1px solid #eee;padding:6px;text-align:left}
.small-note{font-size:12px;color:#666;margin-top:6px}
</style>
</head>
<body>
<header>
  <h1 style="margin:0;font-size:19px;">The Click Catalyst Studio (Pro v2.2)</h1>
  <div class="small-note">Pinterest (@rrbrick123) • Store ID: rishikeshbhav-21</div>
  <div class="status-badge">App ID: 1629028 (Trial Pending) • Studio Product Render</div>
</header>

<div class="container">
  <div class="card">
